<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📋 Канбан</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d0d0f;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 0 10px;
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        
        .add-btn {
            background: #2a2a2e;
            border: 1px solid #3a3a3e;
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .add-btn:hover {
            background: #3a3a3e;
            border-color: #4a4a4e;
        }
        
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .column {
            background: #16161a;
            border-radius: 12px;
            padding: 16px;
            min-height: 400px;
        }
        
        .column-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #2a2a2e;
        }
        
        .column-header h2 {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #888;
        }
        
        .column-header .count {
            background: #2a2a2e;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            color: #666;
        }
        
        .todo .column-header h2 { color: #6b7280; }
        .doing .column-header h2 { color: #f59e0b; }
        .done .column-header h2 { color: #10b981; }
        
        .cards {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .card {
            background: #1e1e24;
            border: 1px solid #2a2a2e;
            border-radius: 8px;
            padding: 12px;
            cursor: grab;
            transition: all 0.2s;
        }
        
        .card:hover {
            border-color: #3a3a3e;
            transform: translateY(-1px);
        }
        
        .card:active {
            cursor: grabbing;
        }
        
        .card.dragging {
            opacity: 0.5;
            transform: rotate(3deg);
        }
        
        .card-text {
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 8px;
        }
        
        .card-actions {
            display: flex;
            gap: 6px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .card:hover .card-actions {
            opacity: 1;
        }
        
        .card-actions button {
            background: transparent;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        
        .card-actions button:hover {
            background: #2a2a2e;
            color: #888;
        }
        
        .card-actions button.delete:hover {
            color: #ef4444;
        }
        
        .empty {
            color: #444;
            text-align: center;
            padding: 40px 20px;
            font-size: 13px;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: #1e1e24;
            border: 1px solid #2a2a2e;
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
        }
        
        .modal-content h3 {
            margin-bottom: 16px;
            font-size: 18px;
        }
        
        .modal-content input {
            width: 100%;
            background: #16161a;
            border: 1px solid #2a2a2e;
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            font-size: 14px;
            margin-bottom: 16px;
        }
        
        .modal-content input:focus {
            outline: none;
            border-color: #3a3a3e;
        }
        
        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        
        .modal-actions button {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .modal-actions .cancel {
            background: transparent;
            border: 1px solid #3a3a3e;
            color: #888;
        }
        
        .modal-actions .cancel:hover {
            background: #2a2a2e;
        }
        
        .modal-actions .save {
            background: #10b981;
            border: none;
            color: #fff;
        }
        
        .modal-actions .save:hover {
            background: #059669;
        }
        
        @media (max-width: 768px) {
            .board {
                grid-template-columns: 1fr;
            }
            
            .column {
                min-height: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📋 Канбан</h1>
        <button class="add-btn" onclick="openModal()">+ Добавить</button>
    </div>
    
    <div class="board">
        <div class="column todo" ondragover="handleDragOver(event)" ondrop="handleDrop(event, 'todo')">
            <div class="column-header">
                <h2>📥 To Do</h2>
                <span class="count" id="todo-count">0</span>
            </div>
            <div class="cards" id="todo-cards"></div>
        </div>
        
        <div class="column doing" ondragover="handleDragOver(event)" ondrop="handleDrop(event, 'doing')">
            <div class="column-header">
                <h2>📋 В работе</h2>
                <span class="count" id="doing-count">0</span>
            </div>
            <div class="cards" id="doing-cards"></div>
        </div>
        
        <div class="column done" ondragover="handleDragOver(event)" ondrop="handleDrop(event, 'done')">
            <div class="column-header">
                <h2>✅ Готово</h2>
                <span class="count" id="done-count">0</span>
            </div>
            <div class="cards" id="done-cards"></div>
        </div>
    </div>
    
    <div class="modal" id="modal">
        <div class="modal-content">
            <h3>Новая задача</h3>
            <input type="text" id="task-input" placeholder="Что нужно сделать?">
            <div class="modal-actions">
                <button class="cancel" onclick="closeModal()">Отмена</button>
                <button class="save" onclick="addTask()">Добавить</button>
            </div>
        </div>
    </div>
    
    <script>
        let tasks = JSON.parse(localStorage.getItem('kanban-tasks')) || {
            todo: [],
            doing: [],
            done: []
        };
        
        let draggedCard = null;
        let draggedFrom = null;
        
        function save() {
            localStorage.setItem('kanban-tasks', JSON.stringify(tasks));
            render();
        }
        
        function render() {
            ['todo', 'doing', 'done'].forEach(col => {
                const container = document.getElementById(`${col}-cards`);
                const count = document.getElementById(`${col}-count`);
                
                count.textContent = tasks[col].length;
                
                if (tasks[col].length === 0) {
                    container.innerHTML = '<div class="empty">Пусто</div>';
                } else {
                    container.innerHTML = tasks[col].map((task, i) => `
                        <div class="card" draggable="true" 
                             ondragstart="handleDragStart(event, '${col}', ${i})"
                             ondragend="handleDragEnd(event)">
                            <div class="card-text">${task}</div>
                            <div class="card-actions">
                                ${col !== 'todo' ? `<button onclick="moveTask('${col}', ${i}, 'todo')">←</button>` : ''}
                                ${col !== 'done' ? `<button onclick="moveTask('${col}', ${i}, 'done')">→</button>` : ''}
                                <button class="delete" onclick="deleteTask('${col}', ${i})">✕</button>
                            </div>
                        </div>
                    `).join('');
                }
            });
        }
        
        function openModal() {
            document.getElementById('modal').classList.add('active');
            document.getElementById('task-input').focus();
        }
        
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.getElementById('task-input').value = '';
        }
        
        function addTask() {
            const input = document.getElementById('task-input');
            const text = input.value.trim();
            if (text) {
                tasks.todo.push(text);
                save();
                closeModal();
            }
        }
        
        function moveTask(from, index, to) {
            const task = tasks[from].splice(index, 1)[0];
            tasks[to].push(task);
            save();
        }
        
        function deleteTask(col, index) {
            tasks[col].splice(index, 1);
            save();
        }
        
        function handleDragStart(event, col, index) {
            draggedCard = { col, index };
            event.target.classList.add('dragging');
        }
        
        function handleDragEnd(event) {
            event.target.classList.remove('dragging');
        }
        
        function handleDragOver(event) {
            event.preventDefault();
        }
        
        function handleDrop(event, toCol) {
            event.preventDefault();
            if (draggedCard && draggedCard.col !== toCol) {
                const task = tasks[draggedCard.col].splice(draggedCard.index, 1)[0];
                tasks[toCol].push(task);
                save();
            }
            draggedCard = null;
        }
        
        document.getElementById('task-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTask();
        });
        
        render();
    </script>
</body>
</html>
