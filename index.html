<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📋 Канбан</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d0d0f;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 0 10px;
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        
        .last-update {
            font-size: 12px;
            color: #666;
        }
        
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .column {
            background: #16161a;
            border-radius: 12px;
            padding: 16px;
            min-height: 400px;
        }
        
        .column-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #2a2a2e;
        }
        
        .column-header h2 {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .column-header .count {
            background: #2a2a2e;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            color: #666;
        }
        
        .todo .column-header h2 { color: #6b7280; }
        .doing .column-header h2 { color: #f59e0b; }
        .done .column-header h2 { color: #10b981; }
        
        .cards {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .card {
            background: #1e1e24;
            border: 1px solid #2a2a2e;
            border-radius: 8px;
            padding: 12px;
            transition: all 0.2s;
        }
        
        .card-text {
            font-size: 14px;
            line-height: 1.4;
        }
        
        .empty {
            color: #444;
            text-align: center;
            padding: 40px 20px;
            font-size: 13px;
        }
        
        .loading {
            color: #666;
            text-align: center;
            padding: 40px 20px;
            font-size: 14px;
        }
        
        @media (max-width: 768px) {
            .board {
                grid-template-columns: 1fr;
            }
            
            .column {
                min-height: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📋 Канбан</h1>
        <span class="last-update" id="last-update"></span>
    </div>
    
    <div class="board">
        <div class="column todo">
            <div class="column-header">
                <h2>📥 To Do</h2>
                <span class="count" id="todo-count">0</span>
            </div>
            <div class="cards" id="todo-cards">
                <div class="loading">Загрузка...</div>
            </div>
        </div>
        
        <div class="column doing">
            <div class="column-header">
                <h2>📋 В работе</h2>
                <span class="count" id="doing-count">0</span>
            </div>
            <div class="cards" id="doing-cards">
                <div class="loading">Загрузка...</div>
            </div>
        </div>
        
        <div class="column done">
            <div class="column-header">
                <h2>✅ Готово</h2>
                <span class="count" id="done-count">0</span>
            </div>
            <div class="cards" id="done-cards">
                <div class="loading">Загрузка...</div>
            </div>
        </div>
    </div>
    
    <script>
        // Load tasks from JSON
        fetch('tasks.json')
            .then(response => response.json())
            .then(data => {
                const tasks = data;
                
                ['todo', 'doing', 'done'].forEach(col => {
                    const container = document.getElementById(`${col}-cards`);
                    const count = document.getElementById(`${col}-count`);
                    
                    count.textContent = tasks[col].length;
                    
                    if (tasks[col].length === 0) {
                        container.innerHTML = '<div class="empty">Пусто</div>';
                    } else {
                        container.innerHTML = tasks[col].map((task, i) => `
                            <div class="card">
                                <div class="card-text">${task}</div>
                            </div>
                        `).join('');
                    }
                });
                
                // Update timestamp
                const now = new Date().toLocaleString('ru-RU');
                document.getElementById('last-update').textContent = `Обновлено: ${now}`;
            })
            .catch(error => {
                console.error('Error loading tasks:', error);
                document.querySelectorAll('.cards').forEach(el => {
                    el.innerHTML = '<div class="empty">Ошибка загрузки</div>';
                });
            });
    </script>
</body>
</html>
