<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Канбан</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <style>
        body {
            background: #121212;
            color: #e0e0e0;
            min-height: 100vh;
        }
        .header-bar {
            background: #1e1e1e;
            padding: 20px 0;
            margin-bottom: 30px;
            border-bottom: 1px solid #333;
        }
        .header-bar h1 {
            font-size: 1.8rem;
            margin: 0;
            color: #fff;
        }
        .header-bar .last-update {
            color: #888;
            font-size: 0.9rem;
        }
        .kanban-column {
            background: #1e1e1e;
            border-radius: 8px;
            padding: 16px;
            min-height: 500px;
            border: 1px solid #333;
        }
        .kanban-column .column-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .kanban-column .column-title .badge {
            background: #333;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            color: #aaa;
        }
        .card-panel-kanban {
            background: #252525;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 12px 16px;
            margin-bottom: 10px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }
        .card-panel-kanban:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            border-color: #555;
        }
        .empty-state {
            color: #555;
            text-align: center;
            padding: 40px 20px;
            font-size: 0.9rem;
        }
        .loading-state {
            color: #666;
            text-align: center;
            padding: 40px 20px;
        }
        .todo-title { color: #90a4ae; }
        .doing-title { color: #ffb74d; }
        .done-title { color: #81c784; }
        @media (max-width: 992px) {
            .kanban-column { min-height: 300px; }
        }
    </style>
</head>
<body>
    <div class="header-bar">
        <div class="container">
            <div class="row valign-wrapper" style="margin-bottom:0">
                <div class="col s12 m6">
                    <h1><i class="material-icons left" style="color:#81c784">dashboard</i>Канбан</h1>
                </div>
                <div class="col s12 m6 right-align">
                    <span class="last-update" id="last-update"></span>
                </div>
            </div>
        </div>
    </div>
    
    <div class="container">
        <div class="row">
            <div class="col s12 l4">
                <div class="kanban-column">
                    <div class="column-title todo-title">
                        <span><i class="material-icons left tiny">inbox</i>To Do</span>
                        <span class="badge" id="todo-count">0</span>
                    </div>
                    <div id="todo-cards">
                        <div class="loading-state">Загрузка...</div>
                    </div>
                </div>
            </div>
            
            <div class="col s12 l4">
                <div class="kanban-column">
                    <div class="column-title doing-title">
                        <span><i class="material-icons left tiny">assignment</i>В работе</span>
                        <span class="badge" id="doing-count">0</span>
                    </div>
                    <div id="doing-cards">
                        <div class="loading-state">Загрузка...</div>
                    </div>
                </div>
            </div>
            
            <div class="col s12 l4">
                <div class="kanban-column">
                    <div class="column-title done-title">
                        <span><i class="material-icons left tiny">check_circle</i>Готово</span>
                        <span class="badge" id="done-count">0</span>
                    </div>
                    <div id="done-cards">
                        <div class="loading-state">Загрузка...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script>
        fetch('tasks.json')
            .then(response => response.json())
            .then(data => {
                const tasks = data;
                
                ['todo', 'doing', 'done'].forEach(col => {
                    const container = document.getElementById(`${col}-cards`);
                    const count = document.getElementById(`${col}-count`);
                    
                    count.textContent = tasks[col].length;
                    
                    if (tasks[col].length === 0) {
                        container.innerHTML = '<div class="empty-state">Пусто</div>';
                    } else {
                        container.innerHTML = tasks[col].map((task) => `
                            <div class="card-panel-kanban">
                                ${task}
                            </div>
                        `).join('');
                    }
                });
                
                const now = new Date().toLocaleString('ru-RU');
                document.getElementById('last-update').textContent = `Обновлено: ${now}`;
            })
            .catch(error => {
                console.error('Error loading tasks:', error);
                document.querySelectorAll('[id$="-cards"]').forEach(el => {
                    el.innerHTML = '<div class="empty-state">Ошибка загрузки</div>';
                });
            });
    </script>
</body>
</html>
